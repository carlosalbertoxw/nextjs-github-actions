# Propone actualizaciones una vez al mes, agrupadas en un solo PR por ecosistema.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # "npm" cubre tambien proyectos con pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # typescript-eslint (via eslint-config-next) todavia no soporta TypeScript 7
      # y el lint falla. Quitar cuando lo soporte:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
