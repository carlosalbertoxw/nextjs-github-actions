# Construye el sitio Next.js como export estatico y lo publica en GitHub Pages.
#
# Documentacion: https://nextjs.org/docs/app/guides/static-exports
#
name: Deploy Next.js site to Pages

on:
  # Se ejecuta en cada push a la rama principal
  push:
    branches: ["main"]

  # En los pull requests solo se ejecutan lint y build, sin desplegar
  pull_request:

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos del GITHUB_TOKEN que necesita el despliegue en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que ya esta en curso
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Toma la version de pnpm del campo packageManager de package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build with Next.js
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
